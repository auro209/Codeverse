<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folio – PDF library</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f5;--panel:#fff;--ink:#13212c;--mute:#5d6e7b;--line:#d3dce2;--acc:#1b6f8f;--on:#fff;--stage:#c9d3da;--sel:#dff0f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161b;--panel:#18222a;--ink:#e6eef3;--mute:#93a5b2;--line:#2a3944;--acc:#5bb8d9;--on:#08202b;--stage:#0b1014;--sel:#1e3340}}
:root[data-theme="dark"]{--bg:#0f161b;--panel:#18222a;--ink:#e6eef3;--mute:#93a5b2;--line:#2a3944;--acc:#5bb8d9;--on:#08202b;--stage:#0b1014;--sel:#1e3340}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font:700 22px Georgia,"Times New Roman",serif;margin:0;letter-spacing:.2px}
.sp{flex:1}
#crumb{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px 0;color:var(--mute);font-size:14px}
#crumb button{border:0;background:none;padding:4px 6px;min-height:32px;color:var(--acc);font-weight:600}
#grid{flex:1;overflow:auto;padding:12px 14px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;align-content:start}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
.card .ic{position:absolute;left:12px;top:12px;width:54px;height:68px;border-radius:5px 8px 8px 5px;background:var(--acc);border-left:7px solid rgba(0,0,0,.25)}
.card.f .ic{height:46px;width:64px;border-radius:6px;border-left:0;background:var(--acc);opacity:.85;clip-path:polygon(0 0,40% 0,50% 14%,100% 14%,100% 100%,0 100%)}
.card b{word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.card small{color:var(--mute)}
.card .mn{position:absolute;right:6px;top:6px;width:40px;padding:0;border:0;background:none;font-size:22px;line-height:1}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--panel);width:min(480px,100%);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:8px;max-height:80%;overflow:auto}
.sheet h3{margin:0 0 4px}
.sheet input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end}
.sheet button.dg{color:#c0392b}
#stage{flex:1;overflow:auto;background:var(--stage);-webkit-overflow-scrolling:touch}
#pages{width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 8px 120px}
.pg{position:relative;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.pg canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#bar{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;align-items:center}
#bar button{flex:none;padding:6px 12px;min-height:44px}
#bar button[aria-pressed="true"]{background:var(--sel);border-color:var(--acc);color:var(--acc);font-weight:700}
.sw{width:30px;height:30px;border-radius:50%;padding:0!important;min-height:30px!important;border:2px solid var(--line)!important}
.sw[aria-pressed="true"]{outline:3px solid var(--acc);outline-offset:2px}
.div{width:1px;align-self:stretch;background:var(--line);flex:none}
#pgl{min-width:70px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30;font-size:14px}
</style>
</head>
<body>
<section class="view" id="lib">
  <header><h1>Folio</h1><span class="sp"></span><button id="nf">New folder</button><button id="ap" class="pri">Add PDFs</button></header>
  <div id="crumb"></div>
  <div id="grid"></div>
  <input type="file" id="fi" accept="application/pdf,.pdf" multiple hidden>
</section>
<section class="view" id="rd" hidden>
  <header><button id="bk" aria-label="Back to library">‹ Library</button><b id="title" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></b><span class="sp"></span><button id="pgl" aria-label="Go to page">–</button></header>
  <div id="stage"><div id="pages"></div></div>
  <div id="bar" role="toolbar" aria-label="Annotation tools">
    <button data-t="hand">Move</button><button data-t="pen">Pen</button><button data-t="hl">Marker</button><button data-t="eraser">Erase</button>
    <span class="div"></span><span id="sws" style="display:flex;gap:8px;align-items:center"></span>
    <button id="sz">Size</button><button id="un">Undo</button>
    <span class="div"></span><button id="zo" aria-label="Zoom out">−</button><button id="zi" aria-label="Zoom in">+</button>
    <button id="po" aria-pressed="false">Pen only</button>
  </div>
</section>
<div id="modal" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let db,nodes=[],cwd=null,cur=null,pdf=null,ann={},undo=[],G=0,zoom=1,tool='pen',sz=1,penOnly=false,live=null,saveT,lastT,obsR,obsP;
const PC=['#13212c','#1b6f8f','#c0392b','#2e8b57','#8e44ad'],HC=['#ffe14d','#7ee081','#ff9ecb','#8fd3ff'];
let pc=PC[1],hc=HC[0];
const PW=[.0018,.003,.0055],HW=[.012,.018,.028];

function toast(t){const e=document.createElement('div');e.id='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('folio',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('nodes',{keyPath:'id'});d.createObjectStore('blobs');d.createObjectStore('ann')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const put=n=>tx('nodes','readwrite',o=>o.put(n));

/* ---------- modal helpers ---------- */
function modal(html){const m=$('#modal');m.innerHTML='<div class="sheet">'+html+'</div>';m.hidden=false;m.onclick=e=>{if(e.target===m)m.hidden=true};return m.firstChild}
const shut=()=>$('#modal').hidden=true;
function ask(title,val,ok){
  const s=modal(`<h3>${esc(title)}</h3><input id="inp" value="${esc(val||'')}"><div class="row"><button id="c">Cancel</button><button id="o" class="pri">${ok||'Save'}</button></div>`);
  const i=s.querySelector('#inp');i.focus();i.select();
  return new Promise(r=>{s.querySelector('#c').onclick=shut;s.querySelector('#o').onclick=()=>{shut();r(i.value.trim())};i.onkeydown=e=>{if(e.key==='Enter')s.querySelector('#o').click()}});
}

/* ---------- library ---------- */
function renderLib(){
  const path=[];let p=cwd;while(p){const n=nodes.find(x=>x.id===p);if(!n)break;path.unshift(n);p=n.parent}
  const cb=$('#crumb');cb.innerHTML='';
  [{id:null,name:'Library'},...path].forEach((n,i,a)=>{const b=document.createElement('button');b.textContent=n.name;b.onclick=()=>{cwd=n.id;renderLib()};cb.appendChild(b);if(i<a.length-1){const s=document.createElement('span');s.textContent='›';s.style.alignSelf='center';cb.appendChild(s)}});
  const items=nodes.filter(n=>n.parent===cwd).sort((a,b)=>(a.type===b.type?0:a.type==='folder'?-1:1)||a.name.localeCompare(b.name));
  const g=$('#grid');
  if(!items.length){g.innerHTML='<div class="empty">'+(cwd?'This folder is empty.':'No PDFs yet.')+' Tap <b>Add PDFs</b> to import your books and notes, or <b>New folder</b> to organise them.</div>';return}
  g.innerHTML=items.map(n=>`<div class="card ${n.type==='folder'?'f':''}" data-id="${n.id}" tabindex="0" role="button"><span class="ic"></span><button class="mn" data-m="${n.id}" aria-label="Options for ${esc(n.name)}">⋯</button><b>${esc(n.name)}</b><small>${n.type==='folder'?nodes.filter(x=>x.parent===n.id).length+' items':(n.last?'Page '+n.last:'PDF')}</small></div>`).join('');
}
$('#grid').addEventListener('click',e=>{
  const m=e.target.closest('[data-m]');if(m){e.stopPropagation();return menu(m.dataset.m)}
  const c=e.target.closest('.card');if(!c)return;const n=nodes.find(x=>x.id===c.dataset.id);
  if(n.type==='folder'){cwd=n.id;renderLib()}else openFile(n);
});
$('#grid').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))e.target.click()});
$('#nf').onclick=async()=>{const name=await ask('New folder','','Create');if(!name)return;const n={id:uid(),type:'folder',name,parent:cwd};nodes.push(n);try{await put(n)}catch(e){toast('Could not save folder')}renderLib()};
$('#ap').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{
  let ok=0;
  for(const f of e.target.files){
    try{const n={id:uid(),type:'file',name:f.name.replace(/\.pdf$/i,''),parent:cwd,last:1};
      await tx('blobs','readwrite',o=>o.put(f,n.id));await put(n);nodes.push(n);ok++}
    catch(err){toast('Could not store '+f.name)}
  }
  e.target.value='';if(ok)toast(ok+' PDF'+(ok>1?'s':'')+' added');renderLib();
};
function menu(id){
  const n=nodes.find(x=>x.id===id);
  const s=modal(`<h3>${esc(n.name)}</h3><button id="rn">Rename</button><button id="mv">Move to…</button><button id="dl" class="dg">Delete</button>`);
  s.querySelector('#rn').onclick=async()=>{const v=await ask('Rename',n.name);if(v){n.name=v;await put(n);renderLib()}};
  s.querySelector('#mv').onclick=()=>move(n);
  s.querySelector('#dl').onclick=()=>{
    const s2=modal(`<h3>Delete “${esc(n.name)}”?</h3><p style="margin:0;color:var(--mute)">${n.type==='folder'?'Everything inside it is deleted too. ':''}This can’t be undone.</p><div class="row"><button id="c">Cancel</button><button id="o" class="pri">Delete</button></div>`);
    s2.querySelector('#c').onclick=shut;
    s2.querySelector('#o').onclick=async()=>{const ids=desc(n.id);
      for(const x of ids){await tx('nodes','readwrite',o=>o.delete(x));await tx('blobs','readwrite',o=>o.delete(x));await tx('ann','readwrite',o=>o.delete(x))}
      nodes=nodes.filter(x=>!ids.has(x.id));shut();renderLib()};
  };
}
function desc(id){const s=new Set([id]);let ch=true;while(ch){ch=false;nodes.forEach(n=>{if(!s.has(n.id)&&s.has(n.parent)){s.add(n.id);ch=true}})}return s}
function move(n){
  const bad=desc(n.id),fs=nodes.filter(x=>x.type==='folder'&&!bad.has(x.id));
  const s=modal('<h3>Move to</h3><button data-d="">Library (top level)</button>'+fs.map(f=>`<button data-d="${f.id}">${esc(f.name)}</button>`).join(''));
  s.onclick=async e=>{const b=e.target.closest('[data-d]');if(!b)return;n.parent=b.dataset.d||null;await put(n);shut();renderLib()};
}

/* ---------- reader ---------- */
async function openFile(n){
  try{
    cur=n;undo=[];zoom=1;
    const blob=await tx('blobs','readonly',o=>o.get(n.id));
    ann=(await tx('ann','readonly',o=>o.get(n.id)))||{};
    pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
    $('#lib').hidden=true;$('#rd').hidden=false;$('#title').textContent=n.name;
    setTool(tool);await build(n.last||1);
  }catch(e){toast('Could not open this PDF');$('#lib').hidden=false;$('#rd').hidden=true}
}
async function build(goto){
  const gen=++G,box=$('#pages');box.innerHTML='';
  obsR&&obsR.disconnect();obsP&&obsP.disconnect();
  const st=$('#stage'),w=Math.max(200,(st.clientWidth-16)*zoom);
  const p1=await pdf.getPage(1),v=p1.getViewport({scale:1}),h=w*v.height/v.width;
  obsR=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting&&!en.target.dataset.done)renderPage(en.target,gen)}),{root:st,rootMargin:'800px 0px'});
  obsP=new IntersectionObserver(es=>es.forEach(en=>{if(en.intersectionRatio>=.4){setPage(+en.target.dataset.i)}}),{root:st,threshold:[.4]});
  for(let i=1;i<=pdf.numPages;i++){
    const d=document.createElement('div');d.className='pg';d.dataset.i=i;d.style.width=w+'px';d.style.height=h+'px';
    d.innerHTML='<canvas class="pdf"></canvas><canvas class="ink"></canvas>';box.appendChild(d);obsR.observe(d);obsP.observe(d);
  }
  if(goto>1){const t=box.children[goto-1];if(t)st.scrollTop=t.offsetTop-10}
  setPage(goto);
}
async function renderPage(el,gen){
  el.dataset.done=1;const i=+el.dataset.i;
  try{
    const pg=await pdf.getPage(i);if(gen!==G)return;
    const w=el.clientWidth,v0=pg.getViewport({scale:1}),s=w/v0.width,dpr=Math.min(window.devicePixelRatio||1,2.5),v=pg.getViewport({scale:s*dpr});
    const c=el.querySelector('.pdf'),k=el.querySelector('.ink');
    c.width=k.width=v.width;c.height=k.height=v.height;el.style.height=v0.height*s+'px';
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    if(gen===G)drawInk(el);
  }catch(e){el.dataset.done=''}
}
function setPage(i){
  $('#pgl').textContent=i+' / '+pdf.numPages;
  if(cur&&cur.last!==i){cur.last=i;clearTimeout(lastT);lastT=setTimeout(()=>put(cur).catch(()=>{}),800)}
}
$('#pgl').onclick=async()=>{const v=parseInt(await ask('Go to page',cur.last,'Go'),10);if(v>0&&v<=pdf.numPages){const t=$('#pages').children[v-1];$('#stage').scrollTop=t.offsetTop-10}};

/* ---------- ink ---------- */
function stroke(x,s,W){
  x.lineCap=x.lineJoin='round';x.strokeStyle=s.c;x.globalAlpha=s.t==='hl'?.35:1;x.lineWidth=s.w*W;x.beginPath();
  s.p.forEach((p,j)=>j?x.lineTo(p[0]*W,p[1]*W):x.moveTo(p[0]*W,p[1]*W));
  if(s.p.length===1)x.lineTo(s.p[0][0]*W+.01,s.p[0][1]*W);
  x.stroke();x.globalAlpha=1;
}
function drawInk(el,extra){
  const k=el.querySelector('.ink'),x=k.getContext('2d'),W=k.width;
  x.clearRect(0,0,W,k.height);(ann[el.dataset.i]||[]).forEach(s=>stroke(x,s,W));if(extra)stroke(x,extra,W);
}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,500)}
function flush(){clearTimeout(saveT);if(cur)tx('ann','readwrite',o=>o.put(ann,cur.id)).catch(()=>toast('Could not save your ink'))}
const pages=$('#pages');
pages.addEventListener('pointerdown',e=>{
  if(tool==='hand'||(penOnly&&e.pointerType!=='pen'))return;
  const el=e.target.closest('.pg');if(!el||live)return;
  e.preventDefault();el.setPointerCapture(e.pointerId);
  const r=el.getBoundingClientRect(),pt=ev=>[+((ev.clientX-r.left)/r.width).toFixed(4),+((ev.clientY-r.top)/r.width).toFixed(4)],i=el.dataset.i;
  live={el,pt,id:e.pointerId,i,prev:(ann[i]||[]).slice(),changed:false};
  if(tool==='eraser')erase(e);
  else live.s={t:tool,c:tool==='hl'?hc:pc,w:(tool==='hl'?HW:PW)[sz],p:[pt(e)]};
});
pages.addEventListener('pointermove',e=>{
  if(!live||e.pointerId!==live.id)return;e.preventDefault();
  if(tool==='eraser')return erase(e);
  (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>live.s.p.push(live.pt(ev)));
  drawInk(live.el,live.s);
});
function erase(e){
  const [x,y]=live.pt(e),a=ann[live.i]||[],n=a.filter(s=>!s.p.some(p=>Math.hypot(p[0]-x,p[1]-y)<.022));
  if(n.length!==a.length){ann[live.i]=n;live.changed=true;drawInk(live.el)}
}
const end=e=>{
  if(!live||e.pointerId!==live.id)return;
  if(tool!=='eraser'&&live.s.p.length){(ann[live.i]=ann[live.i]||[]).push(live.s);live.changed=true}
  if(live.changed){undo.push({i:live.i,prev:live.prev});save()}
  drawInk(live.el);live=null;
};
pages.addEventListener('pointerup',end);pages.addEventListener('pointercancel',end);
$('#un').onclick=()=>{const u=undo.pop();if(!u)return toast('Nothing to undo');ann[u.i]=u.prev;const el=pages.children[u.i-1];if(el)drawInk(el);save()};

/* ---------- toolbar ---------- */
function setTool(t){
  tool=t;$$('#bar [data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));
  pages.style.touchAction=t==='hand'?'auto':(penOnly?'pan-x pan-y pinch-zoom':'none');
  $('#sws').style.display=(t==='pen'||t==='hl')?'flex':'none';$('#sz').style.display=t==='hand'?'none':'';
  const cs=t==='hl'?HC:PC,sel=t==='hl'?hc:pc;
  $('#sws').innerHTML=cs.map(c=>`<button class="sw" data-c="${c}" aria-label="Colour ${c}" aria-pressed="${c===sel}" style="background:${c}"></button>`).join('');
}
$('#bar').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t)return setTool(t.dataset.t);
  const c=e.target.closest('[data-c]');if(c){if(tool==='hl')hc=c.dataset.c;else pc=c.dataset.c;setTool(tool)}
});
$('#sz').onclick=()=>{sz=(sz+1)%3;$('#sz').textContent='Size '+['S','M','L'][sz]};
$('#sz').textContent='Size M';
$('#po').onclick=()=>{penOnly=!penOnly;$('#po').setAttribute('aria-pressed',penOnly);setTool(tool);toast(penOnly?'Pen only: fingers scroll, stylus writes':'Fingers can write too')};
const rezoom=async d=>{const st=$('#stage'),f=st.scrollTop/(st.scrollHeight||1);zoom=Math.min(3,Math.max(.6,+(zoom+d).toFixed(2)));await build(cur.last||1);st.scrollTop=f*st.scrollHeight};
$('#zi').onclick=()=>rezoom(.25);$('#zo').onclick=()=>rezoom(-.25);
$('#bk').onclick=async()=>{flush();await put(cur).catch(()=>{});G++;if(pdf){pdf.destroy();pdf=null}cur=null;$('#rd').hidden=true;$('#lib').hidden=false;renderLib()};
let rt;addEventListener('resize',()=>{if(!pdf)return;clearTimeout(rt);rt=setTimeout(()=>build(cur.last||1),300)});
addEventListener('pagehide',flush);

/* ---------- start ---------- */
(async()=>{
  try{db=await openDB();nodes=await tx('nodes','readonly',o=>o.getAll());navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}
  catch(e){toast('Storage is unavailable here, so files won’t be kept')}
  renderLib();
})();
</script>
</body>
</html>
